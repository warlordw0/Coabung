name: Generate GameMaker Project

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download UndertaleModCli
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/nightly/CLI-windows-latest-Debug-isBundled-true.zip" -OutFile "- name: Run Decompiler
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path output
        
        # Find the exe no matter which subfolder it's in
        $exe = (Get-ChildItem -Path "cli" -Recurse -Filter "UndertaleModCli.exe" | Select-Object -First 1).FullName
        Write-Host "Found executable at: $exe"
        
        # Run it
        & $exe load data.win
        & $exe dump --output output
        dir output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamemaker-project
        path: output/
