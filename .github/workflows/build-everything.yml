name: Extract GameMaker GMS2 Project

on:
  workflow_dispatch:
    inputs:
      data_win_url:
        description: 'URL to download data.win (leave empty to use the one in the repo)'
        required: false
        default: ''

jobs:
  extract:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download UndertaleModCli
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/nightly/CLI-windows-latest-Debug-isBundled-true.zip" -OutFile "cli.zip"
        Expand-Archive -Path "cli.zip" -DestinationPath "cli"

    - name: Install NAudio (Official Release)
      shell: pwsh
      run: |
        # Download the official release zip from GitHub
        Invoke-WebRequest -Uri "https://github.com/naudio/NAudio/releases/download/v2.2.1/NAudio-2.2.1.zip" -OutFile "naudio.zip"
        Expand-Archive -Path "naudio.zip" -DestinationPath "naudio_extracted"
        # Copy ALL audio DLLs into the cli folder to satisfy dependencies
        Get-ChildItem -Path "naudio_extracted" -Recurse -Filter "*.dll" | Copy-Item -Destination "cli" -Force

    - name: Download GMS2 Decompiler Script
      shell: pwsh
      run: |
        $scriptUrl = "https://raw.githubusercontent.com/burnedpopcorn/UnderAnalyzer-Decompiler/main/UndertaleModTool/Decompiling_Scripts/---%20GMS2%20Decompiling%20---/Ultimate_GMS2_Decompiler_v5.csx"
        Invoke-WebRequest -Uri $scriptUrl -OutFile "GMS2Decompiler.csx"

    - name: Run Project Export Script
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path output -Force
        
        $exe = (Get-ChildItem -Path "cli" -Recurse -Filter "UndertaleModCli.exe" | Select-Object -First 1).FullName
        Write-Host "Found CLI at: $exe"
        
        # If a URL was provided, download that data.win instead
        if ("${{ github.event.inputs.data_win_url }}" -ne "") {
          Write-Host "Downloading data.win from provided URL..."
          Invoke-WebRequest -Uri "${{ github.event.inputs.data_win_url }}" -OutFile "data.win"
        }
        
        # Add the cli folder to the PATH so the script can find the audio DLLs
        $env:PATH = "D:\a\Coabung\Coabung\cli;$env:PATH"
        
        Write-Host "--- RUNNING GMS2 EXPORT SCRIPT ---"
        & $exe load "data.win" -s "GMS2Decompiler.csx" -o "output"
        
        Write-Host "--- OUTPUT CONTENTS ---"
        dir output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamemaker-project
        path: output/
