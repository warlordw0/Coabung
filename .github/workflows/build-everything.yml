name: Decompile GMS2 Project (Linux CLI)

on:
  workflow_dispatch:
    inputs:
      data_win_url:
        description: 'URL to download data.win (leave empty to use the one in the repo)'
        required: false
        default: ''

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq unzip wget

    - name: Download Linux CLI Release
      run: |
        # Get the latest release asset URL for Linux
        API_URL="https://api.github.com/repos/UnderminersTeam/UndertaleModTool/releases/latest"
        ASSET_URL=$(curl -s $API_URL | jq -r '.assets[] | select(.name | contains("CLI") and (contains("Linux") or contains("Ubuntu"))) | .browser_download_url' | head -n 1)
        
        if [ -z "$ASSET_URL" ]; then
          echo "No Linux CLI asset found. Trying nightly..."
          API_URL="https://api.github.com/repos/UnderminersTeam/UndertaleModTool/releases/tags/nightly"
          ASSET_URL=$(curl -s $API_URL | jq -r '.assets[] | select(.name | contains("CLI") and (contains("Linux") or contains("Ubuntu"))) | .browser_download_url' | head -n 1)
        fi
        
        echo "Downloading from: $ASSET_URL"
        wget "$ASSET_URL" -O cli.zip
        unzip -o cli.zip -d cli

    - name: Download GMS2 Decompiler Script
      run: |
        wget "https://raw.githubusercontent.com/burnedpopcorn/UnderAnalyzer-Decompiler/main/UndertaleModTool/Decompiling_Scripts/---%20GMS2%20Decompiling%20---/Ultimate_GMS2_Decompiler_v5.csx" -O GMS2Decompiler.csx

    - name: Run Decompiler
      run: |
        mkdir -p output
        
        # If a URL was provided, download that data.win instead
        if [ -n "${{ github.event.inputs.data_win_url }}" ]; then
          wget "${{ github.event.inputs.data_win_url }}" -O data.win
        fi
        
        # Find the CLI executable
        CLI_EXE=$(find cli -type f -name "UndertaleModCli" | head -n 1)
        if [ -z "$CLI_EXE" ]; then
          CLI_EXE=$(find cli -type f -name "*.dll" | head -n 1)
          echo "Found DLL, trying dotnet..."
          dotnet "$CLI_EXE" load "data.win" -s "GMS2Decompiler.csx" -o "output"
        else
          echo "Found CLI at: $CLI_EXE"
          chmod +x "$CLI_EXE"
          "$CLI_EXE" load "data.win" -s "GMS2Decompiler.csx" -o "output"
        fi
        
        echo "--- OUTPUT CONTENTS ---"
        ls -la output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamemaker-project
        path: output/
